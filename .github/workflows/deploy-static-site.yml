name: Deploy static site

# Builds a site and syncs it to the GCS bucket "<bucket_prefix>-<env>".
# The calling workflow must grant `id-token: write` for Workload Identity.
#
# Two jobs: `build` installs and builds with no access to Google Cloud (no
# id-token), and `deploy` holds the token but runs no repository code: it only
# downloads the built site and syncs it. Install scripts and build tools can
# therefore never mint a deploy token.
#
#   jobs:
#     deploy:
#       uses: foxd-io/actions/.github/workflows/deploy-static-site.yml@v1
#       with:
#         bucket_prefix: www-foxd-io
#
# It deploys as gh-<repository with dots as dashes>, the per-repo account the
# foxd-io/infra base stack creates, which only has access to that repo's
# buckets. Prod only deploys from a v* tag.
#
# With `content: true`, the build also gets the site's owner-editable content
# (events, vendors, ...) from api.foxd.io. Two more jobs then hold an id-token,
# for the API rather than Google Cloud, and like `deploy` they run no
# repository code: `content` checks out content.config.json alone, reads it as
# data, and uses only curl and jq; `report` only calls curl. The `build` job
# turns the fetched content into a typed module with `foxd-content generate`
# from @foxd-io/content, which the site lists as a dev dependency. Dev builds
# get drafts and push the schema; prod builds get published content. An admin
# links the repository to its site in the API once.
#
# This makes every deploy of such a site depend on api.foxd.io, code-only ones
# included: if the API is down, `content` fails and nothing deploys. That is
# deliberate. Building without the content would ship a site with its events
# or vendors missing, which is worse than shipping late.

on:
  workflow_call:
    inputs:
      bucket_prefix:
        description: "Bucket name without the -dev/-prod suffix"
        required: true
        type: string
      environment:
        description: "dev or prod. Empty derives it from the ref: tags deploy prod, anything else dev"
        type: string
        default: ""
      build_dir:
        description: "Directory the build writes to, relative to the repository root"
        type: string
        default: "build"
      immutable_dir:
        description: "Content-hashed assets under build_dir, served with a one year cache. Empty disables"
        type: string
        default: "_app/immutable"
      package_manager:
        description: "yarn or npm. Picks the dependency cache and the default commands"
        type: string
        default: "yarn"
      install_command:
        description: "Installs dependencies. Empty uses `yarn install --frozen-lockfile` or `npm ci`"
        type: string
        default: ""
      build_command:
        description: "Builds the site into build_dir. Empty uses `yarn build` or `npm run build`"
        type: string
        default: ""
      build_env:
        description: "Extra environment for install and build, one NAME=value per line. Use it to pass vars instead of putting them inside build_command"
        type: string
        default: ""
      content:
        description: "Build with the site's editable content from api.foxd.io. Needs content.config.json and the @foxd-io/content dev dependency"
        type: boolean
        default: false
      content_out:
        description: "Directory the generated content module (index.js, index.d.ts) is written to"
        type: string
        default: "src/content"
      content_api_url:
        description: "API that serves the content. Also the audience of the OIDC token it is fetched with"
        type: string
        default: "https://api.foxd.io"
      node_version:
        description: "Node version. Empty reads it from package.json"
        type: string
        default: ""
      workload_identity_provider:
        description: "Workload Identity provider resource name"
        type: string
        default: "projects/324306161120/locations/global/workloadIdentityPools/github/providers/github-actions"
      service_account:
        description: "Service account to impersonate. Empty uses the repo's gh-<repo>@foxd-io.iam.gserviceaccount.com"
        type: string
        default: ""

jobs:
  content:
    if: inputs.content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The id-token is for the API. Nothing from the repository runs here: the
    # checkout is the schema file alone, sent as data.
    permissions:
      contents: read
      id-token: write
    env:
      API_URL: ${{ inputs.content_api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: content.config.json
          sparse-checkout-cone-mode: false

      - name: Fetch content
        run: |
          set -euo pipefail
          # call <output file> <curl args...>: fail the step with the API's
          # error message rather than a bare status code.
          call() {
            local out="$1"; shift
            if ! curl -sS --fail-with-body -o "$out" "$@"; then
              echo "::error::$(jq -r '.message // .' "$out" 2>/dev/null || cat "$out")"
              exit 1
            fi
          }

          call "$RUNNER_TEMP/token.json" -G \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$API_URL" "$ACTIONS_ID_TOKEN_REQUEST_URL"
          TOKEN="$(jq -r .value "$RUNNER_TEMP/token.json")"
          rm "$RUNNER_TEMP/token.json"
          echo "::add-mask::$TOKEN"

          # The schema belongs to main, so rebuilding an older release can
          # never roll it back. The API enforces the same rule.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            call "$RUNNER_TEMP/schema-sync.json" -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary @content.config.json "$API_URL/site-build/schema"
            jq -r '"Content schema: \(.created | length) created, \(.updated | length) updated, \(.archived | length) archived"' \
              "$RUNNER_TEMP/schema-sync.json" >> "$GITHUB_STEP_SUMMARY"
          fi

          call content.json -H "Authorization: Bearer $TOKEN" "$API_URL/site-build/content"
          jq -r '"Content (\(.environment)): " + ([.types[] | "\(.key) \(.entries | length)"] | join(", "))' \
            content.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content
          path: content.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: content
    # Runs when content is off (skipped) as well as when it was fetched.
    if: ${{ !cancelled() && (needs.content.result == 'success' || needs.content.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No id-token: nothing in this job can authenticate to Google Cloud.
    permissions:
      contents: read
    outputs:
      bucket: ${{ steps.target.outputs.bucket }}
      service_account: ${{ steps.target.outputs.service_account }}
    env:
      BUILD_DIR: ${{ inputs.build_dir }}
    steps:
      - name: Resolve target
        id: target
        env:
          PREFIX: ${{ inputs.bucket_prefix }}
          ENVIRONMENT: ${{ inputs.environment }}
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          BUILD_ENV: ${{ inputs.build_env }}
          SERVICE_ACCOUNT: ${{ inputs.service_account }}
        run: |
          if [ -z "$ENVIRONMENT" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) ENVIRONMENT=prod ;;
              *) ENVIRONMENT=dev ;;
            esac
          fi
          if [ "$ENVIRONMENT" != dev ] && [ "$ENVIRONMENT" != prod ]; then
            echo "::error::environment must be dev or prod, got '$ENVIRONMENT'"
            exit 1
          fi
          # Releases are tags, so prod never ships an untagged commit, even
          # from a manual run.
          if [ "$ENVIRONMENT" = prod ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::prod only deploys from a v* tag, not $GITHUB_REF"
            exit 1
          fi

          case "$PACKAGE_MANAGER" in
            yarn)
              : "${INSTALL_COMMAND:=yarn install --frozen-lockfile}"
              : "${BUILD_COMMAND:=yarn build}"
              ;;
            npm)
              : "${INSTALL_COMMAND:=npm ci}"
              : "${BUILD_COMMAND:=npm run build}"
              ;;
            *)
              echo "::error::package_manager must be yarn or npm, got '$PACKAGE_MANAGER'"
              exit 1
              ;;
          esac

          # build_env: one NAME=value per line. Names are checked so a value
          # cannot inject another variable into $GITHUB_ENV.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::build_env lines must be NAME=value"
              exit 1
            fi
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$BUILD_ENV"

          if [ -z "$SERVICE_ACCOUNT" ]; then
            REPO="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:].' '[:lower:]-')"
            SERVICE_ACCOUNT="gh-$REPO@foxd-io.iam.gserviceaccount.com"
          fi

          {
            echo "INSTALL_COMMAND=$INSTALL_COMMAND"
            echo "BUILD_COMMAND=$BUILD_COMMAND"
          } >> "$GITHUB_ENV"
          {
            echo "bucket=gs://$PREFIX-$ENVIRONMENT"
            echo "service_account=$SERVICE_ACCOUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying to gs://$PREFIX-$ENVIRONMENT as $SERVICE_ACCOUNT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          node-version-file: ${{ inputs.node_version == '' && 'package.json' || '' }}
          cache: ${{ inputs.package_manager }}

      - name: Install
        run: eval "$INSTALL_COMMAND"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.content
        with:
          name: content
          path: ${{ runner.temp }}/content

      # The site's own pinned @foxd-io/content; never installs one.
      - name: Generate content
        if: inputs.content
        env:
          CONTENT_OUT: ${{ inputs.content_out }}
        run: npm exec --no -- foxd-content generate --content "$RUNNER_TEMP/content/content.json" --out "$CONTENT_OUT"

      - name: Build
        run: eval "$BUILD_COMMAND"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ inputs.build_dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with Google Cloud access. It runs no repository code: no
    # checkout, no install, no build.
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_DIR: site
      BUCKET: ${{ needs.build.outputs.bucket }}
      IMMUTABLE_DIR: ${{ inputs.immutable_dir }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ needs.build.outputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Order matters so a visitor never loads a page whose assets are missing:
      # new hashed assets go up first, then the pages that reference them, and
      # only then are the old hashed assets removed. Checksums decide what
      # changed, since every build gives every file a new modification time.
      - name: Upload immutable assets
        if: inputs.immutable_dir != ''
        run: |
          gcloud storage rsync --recursive --checksums-only \
            --cache-control="public, max-age=31536000, immutable" \
            "$BUILD_DIR/$IMMUTABLE_DIR" "$BUCKET/$IMMUTABLE_DIR"

      # Pages are revalidated on every request, so a deploy is live at once
      # rather than after the CDN's default hour.
      - name: Sync site
        run: |
          EXCLUDE=()
          if [ -n "$IMMUTABLE_DIR" ]; then
            EXCLUDE=(--exclude="^${IMMUTABLE_DIR//./\\.}/.*")
          fi
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            --cache-control=no-cache "${EXCLUDE[@]}" "$BUILD_DIR" "$BUCKET"

      - name: Remove stale immutable assets
        if: inputs.immutable_dir != ''
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            --cache-control="public, max-age=31536000, immutable" \
            "$BUILD_DIR/$IMMUTABLE_DIR" "$BUCKET/$IMMUTABLE_DIR"

  # Tells the API how the deploy that read its content ended; the last
  # succeeded prod deploy is the release a content publish rebuilds. Never
  # fails the workflow.
  report:
    needs: [content, build, deploy]
    if: ${{ always() && needs.content.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Report deploy
        continue-on-error: true
        env:
          API_URL: ${{ inputs.content_api_url }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) STATUS=succeeded ;;
            cancelled) STATUS=cancelled ;;
            *) STATUS=failed ;;
          esac
          TOKEN="$(curl -sS --fail-with-body -G \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$API_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          echo "::add-mask::$TOKEN"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "{\"status\":\"$STATUS\"}" "$API_URL/site-build/report" >/dev/null \
            || echo "::warning::Could not report the $STATUS deploy to $API_URL"
